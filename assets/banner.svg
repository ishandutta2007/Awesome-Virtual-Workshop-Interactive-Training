<svg xmlns="http://www.w3.org/2000/svg" width="100%" height="360" viewBox="0 0 1200 360" style="background:#0b0f19;font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,Helvetica,Arial,sans-serif;border-radius:12px;overflow:hidden"><defs><linearGradient id="bg-grad" x1="0%" x2="100%" y1="0%" y2="100%"><stop offset="0%" stop-color="#0f172a"/><stop offset="50%" stop-color="#0b0f19"/><stop offset="100%" stop-color="#020617"/></linearGradient><linearGradient id="primary-grad" x1="0%" x2="100%" y1="0%" y2="0%"><stop offset="0%" stop-color="#38bdf8"/><stop offset="50%" stop-color="#818cf8"/><stop offset="100%" stop-color="#c084fc"/></linearGradient><linearGradient id="card-grad1" x1="0%" x2="100%" y1="0%" y2="100%"><stop offset="0%" stop-color="#1e293b" stop-opacity=".8"/><stop offset="100%" stop-color="#0f172a" stop-opacity=".9"/></linearGradient><linearGradient id="card-border" x1="0%" x2="100%" y1="0%" y2="100%"><stop offset="0%" stop-color="#38bdf8" stop-opacity=".5"/><stop offset="100%" stop-color="#818cf8" stop-opacity=".2"/></linearGradient><filter id="glow" width="140%" height="140%" x="-20%" y="-20%"><feGaussianBlur result="blur" stdDeviation="15"/><feComposite in="SourceGraphic" in2="blur" operator="over"/></filter><filter id="glow-subtle" width="140%" height="140%" x="-20%" y="-20%"><feGaussianBlur result="blur" stdDeviation="6"/><feComposite in="SourceGraphic" in2="blur" operator="over"/></filter></defs><style>@keyframes floatSlow{0%{transform:translateY(0) rotate(0deg)}50%{transform:translateY(-8px) rotate(1deg)}}@keyframes floatOpposite{0%{transform:translateY(0) rotate(0deg)}50%{transform:translateY(7px) rotate(-1.5deg)}}@keyframes pulseGlow{0%{opacity:.35;transform:scale(1)}50%{opacity:.65;transform:scale(1.08)}}@keyframes waveDash{0%{stroke-dashoffset:0}}@keyframes nodePulse{0%{r:5;opacity:.8}50%{r:7.5;opacity:1}}@keyframes shimmerBar{0%{width:40px}50%{width:140px}}.bg-orb-1{animation:pulseGlow 7s ease-in-out infinite;transform-origin:200px 180px}.bg-orb-2{animation:pulseGlow 9s ease-in-out infinite alternate;transform-origin:1000px 150px}.interactive-card-left{animation:floatSlow 6s ease-in-out infinite;transform-origin:120px 220px}.interactive-card-right{animation:floatOpposite 7s ease-in-out infinite;transform-origin:1050px 180px}.stream-line{stroke-dasharray:6 6;animation:waveDash 3s linear infinite}.pulse-dot{animation:nodePulse 2.5s ease-in-out infinite}</style><rect width="1200" height="360" fill="url(#bg-grad)"/><g opacity=".12"><path stroke="#38bdf8" stroke-width="1" d="M 0 60 L 1200 60 M 0 120 L 1200 120 M 0 180 L 1200 180 M 0 240 L 1200 240 M 0 300 L 1200 300"/><path stroke="#38bdf8" stroke-width="1" d="M 150 0 L 150 360 M 300 0 L 300 360 M 450 0 L 450 360 M 600 0 L 600 360 M 750 0 L 750 360 M 900 0 L 900 360 M 1050 0 L 1050 360"/></g><circle cx="180" cy="180" r="140" fill="#0284c7" class="bg-orb-1" filter="url(#glow)" opacity=".25"/><circle cx="1020" cy="160" r="150" fill="#7c3aed" class="bg-orb-2" filter="url(#glow)" opacity=".22"/><circle cx="600" cy="50" r="100" fill="#3b82f6" filter="url(#glow)" opacity=".12"/><g fill="none" opacity=".45"><path stroke="#38bdf8" stroke-width="2" d="M 60 140 C 160 80, 240 260, 320 220" class="stream-line"/><path stroke="#c084fc" stroke-width="2" d="M 880 240 C 960 280, 1060 100, 1140 160" class="stream-line"/></g><g class="interactive-card-left"><rect width="165" height="110" x="50" y="70" fill="url(#card-grad1)" stroke="url(#card-border)" stroke-width="1.5" rx="10"/><rect width="55" height="42" x="65" y="85" fill="#fbbf24" opacity=".85" rx="4"/><line x1="72" x2="108" y1="96" y2="96" stroke="#78350f" stroke-linecap="round" stroke-width="2.5"/><line x1="72" x2="100" y1="104" y2="104" stroke="#78350f" stroke-linecap="round" stroke-width="2.5"/><line x1="72" x2="92" y1="112" y2="112" stroke="#78350f" stroke-linecap="round" stroke-width="2"/><rect width="60" height="48" x="135" y="105" fill="#38bdf8" opacity=".85" rx="4"/><line x1="143" x2="182" y1="118" y2="118" 