<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 360" width="100%" height="360" style="background:#0b0f19; font-family:-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif; border-radius:12px; overflow:hidden;">
  <defs>
    <!-- Background Gradient -->
    <linearGradient id="bg-grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0f172a" />
      <stop offset="50%" stop-color="#0b0f19" />
      <stop offset="100%" stop-color="#020617" />
    </linearGradient>

    <!-- Vibrant Gradient Accents -->
    <linearGradient id="primary-grad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#38bdf8" />
      <stop offset="50%" stop-color="#818cf8" />
      <stop offset="100%" stop-color="#c084fc" />
    </linearGradient>

    <linearGradient id="card-grad1" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#1e293b" stop-opacity="0.8" />
      <stop offset="100%" stop-color="#0f172a" stop-opacity="0.9" />
    </linearGradient>

    <linearGradient id="card-border" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#38bdf8" stop-opacity="0.5" />
      <stop offset="100%" stop-color="#818cf8" stop-opacity="0.2" />
    </linearGradient>

    <!-- Glow Filter -->
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="15" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>

    <filter id="glow-subtle" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="6" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <style>
    /* CSS Keyframe Animations */
    @keyframes floatSlow {
      0%, 100% { transform: translateY(0px) rotate(0deg); }
      50% { transform: translateY(-8px) rotate(1deg); }
    }
    @keyframes floatOpposite {
      0%, 100% { transform: translateY(0px) rotate(0deg); }
      50% { transform: translateY(7px) rotate(-1.5deg); }
    }
    @keyframes pulseGlow {
      0%, 100% { opacity: 0.35; transform: scale(1); }
      50% { opacity: 0.65; transform: scale(1.08); }
    }
    @keyframes waveDash {
      0% { stroke-dashoffset: 0; }
      100% { stroke-dashoffset: -60; }
    }
    @keyframes nodePulse {
      0%, 100% { r: 5; opacity: 0.8; }
      50% { r: 7.5; opacity: 1; }
    }
    @keyframes shimmerBar {
      0% { width: 40px; }
      50% { width: 140px; }
      100% { width: 40px; }
    }

    .bg-orb-1 {
      animation: pulseGlow 7s ease-in-out infinite;
      transform-origin: 200px 180px;
    }
    .bg-orb-2 {
      animation: pulseGlow 9s ease-in-out infinite alternate;
      transform-origin: 1000px 150px;
    }
    .interactive-card-left {
      animation: floatSlow 6s ease-in-out infinite;
      transform-origin: 120px 220px;
    }
    .interactive-card-right {
      animation: floatOpposite 7s ease-in-out infinite;
      transform-origin: 1050px 180px;
    }
    .stream-line {
      stroke-dasharray: 6 6;
      animation: waveDash 3s linear infinite;
    }
    .pulse-dot {
      animation: nodePulse 2.5s ease-in-out infinite;
    }
  </style>

  <!-- Deep Workspace Base -->
  <rect width="1200" height="360" fill="url(#bg-grad)" />

  <!-- Technical Grid Texture -->
  <g opacity="0.12">
    <path d="M 0 60 L 1200 60 M 0 120 L 1200 120 M 0 180 L 1200 180 M 0 240 L 1200 240 M 0 300 L 1200 300" stroke="#38bdf8" stroke-width="1" />
    <path d="M 150 0 L 150 360 M 300 0 L 300 360 M 450 0 L 450 360 M 600 0 L 600 360 M 750 0 L 750 360 M 900 0 L 900 360 M 1050 0 L 1050 360" stroke="#38bdf8" stroke-width="1" />
  </g>

  <!-- Ambient Glowing Orbs (Behind content) -->
  <circle class="bg-orb-1" cx="180" cy="180" r="140" fill="#0284c7" opacity="0.25" filter="url(#glow)" />
  <circle class="bg-orb-2" cx="1020" cy="160" r="150" fill="#7c3aed" opacity="0.22" filter="url(#glow)" />
  <circle cx="600" cy="50" r="100" fill="#3b82f6" opacity="0.12" filter="url(#glow)" />

  <!-- Dynamic Connecting Network Curves (Background interaction flow) -->
  <g fill="none" opacity="0.45">
    <path d="M 60 140 C 160 80, 240 260, 320 220" stroke="#38bdf8" stroke-width="2" class="stream-line" />
    <path d="M 880 240 C 960 280, 1060 100, 1140 160" stroke="#c084fc" stroke-width="2" class="stream-line" />
  </g>

  <!-- Dynamic Background Element: Left Floating Training Card (Sticky notes / workshop canvas) -->
  <g class="interactive-card-left">
    <rect x="50" y="70" width="165" height="110" rx="10" fill="url(#card-grad1)" stroke="url(#card-border)" stroke-width="1.5" />
    <!-- Mini Sticky Note 1 -->
    <rect x="65" y="85" width="55" height="42" rx="4" fill="#fbbf24" opacity="0.85" />
    <line x1="72" y1="96" x2="108" y2="96" stroke="#78350f" stroke-width="2.5" stroke-linecap="round" />
    <line x1="72" y1="104" x2="100" y2="104" stroke="#78350f" stroke-width="2.5" stroke-linecap="round" />
    <line x1="72" y1="112" x2="92" y2="112" stroke="#78350f" stroke-width="2" stroke-linecap="round" />
    <!-- Mini Sticky Note 2 -->
    <rect x="135" y="105" width="60" height="48" rx="4" fill="#38bdf8" opacity="0.85" />
    <line x1="143" y1="118" x2="182" y2="118" stroke="#0369a1" stroke-width="2.5" stroke-linecap="round" />
    <line x1="143" y1="126" x2="174" y2="126" stroke="#0369a1" stroke-width="2.5" stroke-linecap="round" />
    <line x1="143" y1="134" x2="165" y2="134" stroke="#0369a1" stroke-width="2" stroke-linecap="round" />
    <circle cx="195" cy="85" r="4" fill="#34d399" class="pulse-dot" />
    <text x="70" y="165" fill="#94a3b8" font-size="10" font-weight="600">🎨 CANVAS ACTIVE</text>
  </g>

  <!-- Dynamic Background Element: Right Floating Polling / Quiz Metrics Card -->
  <g class="interactive-card-right">
    <rect x="980" y="175" width="175" height="120" rx="10" fill="url(#card-grad1)" stroke="url(#card-border)" stroke-width="1.5" />
    <text x="998" y="200" fill="#38bdf8" font-size="11" font-weight="700">⚡ LIVE AUDIENCE POLL</text>
    <!-- Dynamic Poll Bar 1 -->
    <rect x="998" y="212" width="135" height="12" rx="6" fill="#1e293b" />
    <rect x="998" y="212" width="112" height="12" rx="6" fill="url(#primary-grad)">
      <animate attributeName="width" values="85;125;85" dur="4s" repeatCount="indefinite" />
    </rect>
    <text x="1118" y="222" fill="#ffffff" font-size="9" font-weight="bold">84%</text>
    <!-- Dynamic Poll Bar 2 -->
    <rect x="998" y="234" width="135" height="12" rx="6" fill="#1e293b" />
    <rect x="998" y="234" width="68" height="12" rx="6" fill="#818cf8">
      <animate attributeName="width" values="45;75;45" dur="4.8s" repeatCount="indefinite" />
    </rect>
    <text x="1075" y="244" fill="#ffffff" font-size="9" font-weight="bold">52%</text>
    <!-- Live Voting Activity Indicator -->
    <circle cx="1005" cy="270" r="4" fill="#10b981" class="pulse-dot" />
    <text x="1016" y="274" fill="#cbd5e1" font-size="10">248 Participants Voting</text>
  </g>

  <!-- FOREGROUND CONTENT: Title, Badges, and Subtitle (Guaranteed in foreground) -->
  <g>
    <!-- Category Pill Badge -->
    <g transform="translate(425, 42)">
      <rect width="350" height="30" rx="15" fill="#1e293b" stroke="#38bdf8" stroke-width="1.2" opacity="0.95" />
      <circle cx="20" cy="15" r="4.5" fill="#38bdf8" class="pulse-dot" />
      <text x="35" y="20" fill="#e2e8f0" font-size="11.5" font-weight="700" letter-spacing="1.2">CURATED ECOSYSTEM &amp; PLATFORMS</text>
    </g>

    <!-- Main Title -->
    <text x="600" y="132" text-anchor="middle" font-size="37" font-weight="900" fill="#ffffff" letter-spacing="-0.5">
      Awesome Virtual Workshop
    </text>
    <text x="600" y="178" text-anchor="middle" font-size="34" font-weight="900" fill="url(#primary-grad)" letter-spacing="-0.5">
      &amp; Interactive Training
    </text>

    <!-- Subtitle / Tagline -->
    <text x="600" y="222" text-anchor="middle" font-size="15" font-weight="500" fill="#94a3b8">
      Enterprise SaaS &amp; Open-Source Whiteboards • Live Polling • Gamified Quizzes • Session Planners
    </text>

    <!-- Feature Pillars Badges in Foreground -->
    <g transform="translate(300, 258)">
      <!-- Badge 1: Collaborative Whiteboards -->
      <g transform="translate(0, 0)">
        <rect width="180" height="34" rx="8" fill="#1e293b" stroke="#475569" stroke-width="1" />
        <text x="90" y="22" text-anchor="middle" fill="#38bdf8" font-size="12" font-weight="600">🎨 Digital Whiteboards</text>
      </g>
      <!-- Badge 2: Live Polling & Q&A -->
      <g transform="translate(195, 0)">
        <rect width="190" height="34" rx="8" fill="#1e293b" stroke="#475569" stroke-width="1" />
        <text x="95" y="22" text-anchor="middle" fill="#a78bfa" font-size="12" font-weight="600">📊 Live Polling &amp; Quizzes</text>
      </g>
      <!-- Badge 3: Agenda & Lab Facilitation -->
      <g transform="translate(400, 0)">
        <rect width="200" height="34" rx="8" fill="#1e293b" stroke="#475569" stroke-width="1" />
        <text x="100" y="22" text-anchor="middle" fill="#34d399" font-size="12" font-weight="600">⏱️ Session Orchestration</text>
      </g>
    </g>

    <!-- Bottom Metadata / GitHub Indicator -->
    <text x="600" y="328" text-anchor="middle" font-size="11.5" font-weight="500" fill="#64748b">
      ⚡ Open-Source Self-Hosted Architectures &amp; Commercial Facilitation Software Compared
    </text>
  </g>
</svg>
